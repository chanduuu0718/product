services:
  - type: web
    name: upcha-product
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: APP_DATA_DIR
        value: /var/data
    disk:
      name: upcha-data
      mountPath: /var/data
      sizeGB: 10
